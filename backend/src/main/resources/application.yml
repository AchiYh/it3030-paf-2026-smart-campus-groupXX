spring:
  application:
    name: smart-campus

  data:
    mongodb:
      uri: mongodb+srv://admin:12345@cluster0.gpd2z4o.mongodb.net/smartcampus?retryWrites=true&w=majority
      database: smartcampus

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${OAUTH2_GOOGLE_CLIENT_ID:your-client-id}
            client-secret: ${OAUTH2_GOOGLE_CLIENT_SECRET:your-client-secret}
            scope: openid, profile, email

server:
  port: 8081
  servlet:
    context-path: /api

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:SGVsbG8gV29ybGQgSGVsbG8gV29ybGQgSGVsbG8gV29ybGQgSGVsbG8gV29ybGQ=}
  expiration: 86400000  # 24 hours in milliseconds

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# File Upload
spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB

# Logging
logging:
  level:
    com.sliit.smartcampus: DEBUG
    org.springframework.security: DEBUG
